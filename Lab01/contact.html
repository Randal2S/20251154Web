        <main class="content">
            <h1>Formulario de Contacto</h1>
            <p>Completa el siguiente formulario para enviarme un mensaje (Demostrativo - No funcional):</p>

            <form action="#" method="get">
                <fieldset>
                    <legend><strong>Tus datos</strong></legend>
                    
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" placeholder="Tu nombre...">

                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="tu@correo.com">

                    <label for="message">Mensaje:</label>
                    <textarea id="message" name="message" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>

                    <button type="submit">Enviar Mensaje</button>
                </fieldset>
            </form>

            <hr>
            <footer>
                <em>Formulario básico de contacto.</em>
            </footer>
        </main>
    </div>
</body>
</html>
