<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Académico</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="card">

        <h1>Registro de Estudiante</h1>
        <p class="descripcion">
            Complete los siguientes datos para registrarse en el sistema académico.
        </p>

        <form action="#" method="POST">

            <!-- INFORMACIÓN PERSONAL -->
            <fieldset>
                <legend>Información Personal</legend>

                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                        minlength="3"
                        placeholder="Ingrese su nombre completo"
                    >
                </div>

                <div class="form-group">
                    <label for="codigo">Código de estudiante:</label>
                    <input
                        type="text"
                        id="codigo"
                        name="codigo"
                        required
                        pattern="[0-9]{8}"
                        maxlength="8"
                        inputmode="numeric"
                        placeholder="Ejemplo: 20251154"
                    >
                    <small>Debe contener exactamente 8 dígitos.</small>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="usuario@universidad.edu.pe"
                    >
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha de nacimiento:</label>
                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required
                        min="1990-01-01"
                        max="2012-12-31"
                    >
                </div>

                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <input
                        type="number"
                        id="edad"
                        name="edad"
                        required
                        min="14"
                        max="100"
                        placeholder="Ingrese su edad"
                    >
                </div>

            </fieldset>


            <fieldset>
                <legend>Información de la Cuenta</legend>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="8"
                        pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                        placeholder="Mínimo 8 caracteres"
                    >
                    <small>
                        Debe tener mínimo 8 caracteres, una mayúscula y un número.
                    </small>
                </div>

                <div class="form-group">
                    <label for="carrera">Carrera Profesional:</label>
                    <select id="carrera" name="carrera" required>
                        <option value="">Seleccione una carrera</option>
                        <option value="ingenieria-sistemas">
                            Ingeniería de Sistemas
                        </option>
                        <option value="ingenieria-computacion">
                            Ingeniería de Computación
                        </option>
                        <option value="ingenieria-industrial">
                            Ingeniería Industrial
                        </option>
                        <option value="ingenieria-civil">
                            Ingeniería Civil
                        </option>
                        <option value="administracion">
                            Administración
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <p class="label-title">Turno:</p>

                    <label class="radio-label">
                        <input
                            type="radio"
                            name="turno"
                            value="manana"
                            required
                        >
                        Mañana
                    </label>

                    <label class="radio-label">
                        <input
                            type="radio"
                            name="turno"
                            value="tarde"
                        >
                        Tarde
                    </label>

                    <label class="radio-label">
                        <input
                            type="radio"
                            name="turno"
                            value="noche"
                        >
                        Noche
                    </label>
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios:</label>
                    <textarea
                        id="comentarios"
                        name="comentarios"
                        rows="4"
                        maxlength="300"
                        placeholder="Escriba algún comentario..."
                    ></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input
                            type="checkbox"
                            id="terminos"
                            name="terminos"
                            required
                        >
                        Acepto los términos y condiciones.
                    </label>
                </div>

            </fieldset>


            <div class="buttons">

                <button type="submit">
                    Registrar estudiante
                </button>

                <button type="reset" class="btn-reset">
                    Limpiar
                </button>

            </div>

        </form>

    </main>

</body>
</html>
