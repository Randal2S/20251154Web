<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas Universitarias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Gestor de Tareas Universitarias
            </span>
        </div>
    </nav>

    <main class="container py-4">

        <div class="text-center mb-4">
            <h1>Mis tareas académicas</h1>
            <p class="text-muted">
                Organiza y controla tus actividades universitarias.
            </p>
        </div>

        <section class="card shadow-sm mb-4">
            <div class="card-body">

                <h2 class="h4 mb-3">Agregar tarea</h2>

                <form id="task-form">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="titulo" class="form-label">
                                Título
                            </label>

                            <input
                                type="text"
                                id="titulo"
                                class="form-control"
                                placeholder="Ej. Terminar laboratorio"
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="curso" class="form-label">
                                Curso
                            </label>

                            <input
                                type="text"
                                id="curso"
                                class="form-control"
                                placeholder="Ej. Desarrollo Web"
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="fechaEntrega" class="form-label">
                                Fecha de entrega
                            </label>

                            <input
                                type="date"
                                id="fechaEntrega"
                                class="form-control"
                            >
                        </div>

                        <div class="col-md-6 d-flex align-items-end">
                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Agregar tarea
                            </button>
                        </div>

                    </div>

                </form>

                <div id="alert-container" class="mt-3"></div>

            </div>
        </section>

        <section class="mb-4">

            <div class="d-flex flex-wrap gap-2 mb-3">

                <button
                    class="btn btn-outline-primary filter-btn active"
                    data-filter="todas"
                >
                    Todas
                </button>

                <button
                    class="btn btn-outline-warning filter-btn"
                    data-filter="pendientes"
                >
                    Pendientes
                </button>

                <button
                    class="btn btn-outline-success filter-btn"
                    data-filter="completadas"
                >
                    Completadas
                </button>

            </div>

        </section>

        <section>

            <h2 class="h4 mb-3">Lista de tareas</h2>

            <div id="task-list" class="row g-3"></div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">
            Laboratorio 04 - JavaScript y DOM
        </p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
